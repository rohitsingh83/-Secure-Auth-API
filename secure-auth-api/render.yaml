services:
  - type: web
    name: secure-auth-api
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: RATE_LIMIT_MAX
        value: "100"
      - key: AUTH_RATE_LIMIT_MAX
        value: "10"
      # Set these in Render dashboard (secret values):
      # MONGO_URI, JWT_SECRET, JWT_REFRESH_SECRET
databases:
  - name: secure-auth-mongo
    databaseName: secure_auth_db
    plan: free
